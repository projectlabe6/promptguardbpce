[project]
name = "promptguard"
version = "1.0.0"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["venv/", ".venv/", "build/", "dist/"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["venv/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
